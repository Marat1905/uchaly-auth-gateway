events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Gzip сжатие
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript
                   application/javascript application/xml+rss application/json;

        # ============================================================
        # API Gateway (YARP + админ-панель)
        #
        # Все запросы на /api/* уходят в Gateway, который:
        #   - валидирует JWT от Authentik;
        #   - обслуживает /api/admin/* через AdminController;
        #   - проксирует /api/Nodes, /api/Alerts и т.д.
        #     в микросервисы.
        #
        # ВАЖНО: этот location ОБЯЗАН быть ВЫШЕ location /,
        # иначе SPA перехватит /api/* и вернёт index.html.
        #
        # Gateway слушает GATEWAY_HTTP_PORT (по умолчанию 8080).
        # В docker-сети имя контейнера — uchaly-apigateway.
        # ============================================================
        location /api/ {
            proxy_pass http://uchaly-apigateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================
        # Аутентификация через Authentik (прокси через Gateway)
        #
        # Gateway проксирует /auth/authentik/* на Authentik Server.
        # OAuth2/OIDC-эндпоинты (/application/o/*) SPA вызывает
        # напрямую по VITE_AUTHENTIK_URL (http://localhost:9000),
        # их проксировать не нужно.
        # ============================================================
        location /auth/authentik/ {
            proxy_pass http://uchaly-apigateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================
        # Swagger UI микросервисов (проксируется через Gateway).
        #
        # Префиксы маршрутов YARP из appsettings.json шлюза.
        # ============================================================
        location /monitoring/ {
            proxy_pass http://uchaly-apigateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /motor/ {
            proxy_pass http://uchaly-apigateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /humidity/ {
            proxy_pass http://uchaly-apigateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /safety/ {
            proxy_pass http://uchaly-apigateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================
        # SignalR (WebSocket) — проксируем на Gateway, он — на
        # микросервис мониторинга. Требуется Upgrade-заголовок.
        # ============================================================
        location /alertHub/ {
            proxy_pass http://uchaly-apigateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # ============================================================
        # Кэширование статических файлов.
        # ВАЖНО: идёт ПОСЛЕ проксирующих location'ов, но до /.
        # ============================================================
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ============================================================
        # SPA fallback (React Router).
        #
        # ВАЖНО: location / — последний. Любой неизвестный путь
        # (в т.ч. /admin, /profile, /login) отдаёт index.html,
        # и React Router сам разбирается, что рендерить.
        #
        # Keycloak-прокси (/realms, /admin, /resources) УДАЛЕНЫ:
        # их больше нет, потому что IdP теперь Authentik.
        # Если оставить location /admin, он перехватит навигацию
        # браузера и вернёт 502 (как было с Vite).
        # ============================================================
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}