# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: "Uchaly Application Setup"
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ============================================================
  # ГРУППЫ РОЛЕЙ
  # Аналог таблицы Roles из кастомного Identity.
  # Создаются первыми, потому что на них ссылаются и пользователи,
  # и policy bindings в конце файла.
  # ============================================================
  - model: authentik_core.group
    id: group-admin
    identifiers:
      name: Admin
    attrs:
      is_superuser: true

  - model: authentik_core.group
    id: group-user
    identifiers:
      name: User

  - model: authentik_core.group
    id: group-manager
    identifiers:
      name: Manager

  - model: authentik_core.group
    id: group-diagnost
    identifiers:
      name: Diagnost

  - model: authentik_core.group
    id: group-service
    identifiers:
      name: Service

  - model: authentik_core.group
    id: group-safety
    identifiers:
      name: Safety

  - model: authentik_core.group
    id: group-tcx
    identifiers:
      name: TCX

  - model: authentik_core.group
    id: group-electric
    identifiers:
      name: Electric

  # ============================================================
  # PROPERTY MAPPING: добавление групп (ролей) в токен
  # Определяется до провайдера, чтобы можно было на него ссылаться.
  #
  # ВАЖНО ПРО user.groups:
  #   В 2026.8.3 поле user.ak_groups объявлено deprecated. Используем
  #   user.groups — функционально то же самое, но без warning'ов в логах.
  # ============================================================
  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    identifiers:
      name: "Uchaly: Groups Claim"
    attrs:
      scope_name: groups
      description: "Include user groups in token"
      expression: |
        return {
            "groups": [group.name for group in user.groups.all()],
            "roles": [group.name for group in user.groups.all()]
        }

  # ============================================================
  # PROPERTY MAPPING: profile-claim с ФИО из атрибутов
  #
  # ЗАЧЕМ ЭТО НУЖНО:
  #   Стандартный маппинг Authentik "authentik default OAuth Mapping:
  #   OpenID 'profile'" формирует given_name/family_name путём
  #   разбиения единого поля user.name по пробелам. Но у нас больше
  #   нет единого поля name — при регистрации пользователь вводит
  #   Фамилия/Имя/Отчество раздельно, и они сохраняются в JSONB-поле
  #   user.attributes под ключами family_name, given_name, middle_name.
  #
  #   Поэтому мы подменяем стандартный profile-маппинг своим, который:
  #     1. Читает три атрибута напрямую.
  #     2. Склеивает их в единое поле `name` в формате
  #        "Фамилия Имя Отчество" (для отображения).
  #     3. Возвращает каждое из трёх значений отдельным claim'ом
  #        (given_name, family_name, middle_name) — чтобы фронтенд
  #        мог разложить их в firstName / lastName / patronymic.
  #
  #   preferred_username и nickname отдаём как username пользователя —
  #   так же, как это делает стандартный маппинг Authentik.
  # ============================================================
  - model: authentik_providers_oauth2.scopemapping
    id: scope-profile-uchaly
    identifiers:
      name: "Uchaly: Profile Claim"
    attrs:
      scope_name: profile
      description: "Profile claim с раздельными ФИО из user.attributes"
      expression: |
        # Читаем атрибуты, записанные на этапе регистрации (UserWriteStage).
        family = user.attributes.get("family_name", "") or ""
        given  = user.attributes.get("given_name", "") or ""
        middle = user.attributes.get("middle_name", "") or ""

        # Склеиваем в единое "Фамилия Имя Отчество" в русском порядке.
        # Если атрибутов нет — падаем на user.name (стандартное поле
        # Authentik) или username, чтобы claim name никогда не был пустым.
        parts = []
        if family:
            parts.append(family)
        if given:
            parts.append(given)
        if middle:
            parts.append(middle)

        full_name = " ".join(parts) if parts else (user.name or user.username)

        return {
            "name": full_name,
            "given_name": given,
            "family_name": family,
            "middle_name": middle,
            "preferred_username": user.username,
            "nickname": user.username,
        }

  # ============================================================
  # FLOW АВТОРИЗАЦИИ (НЕ ИСПОЛЬЗУЕТСЯ ПРОВАЙДЕРОМ)
  #
  # ВНИМАНИЕ: провайдер provider-uchaly использует ДЕФОЛТНЫЙ
  # flow авторизации Authentik
  # (default-provider-authorization-implicit-consent), а не этот.
  #
  # Этот кастомный flow оставлен в blueprint на случай, если
  # когда-нибудь понадобится вернуться к форсированному перелогину
  # (пользователь вводит логин/пароль при КАЖДОМ /authorize/).
  #
  # ЕСЛИ НЕ ПЛАНИРУЕТЕ ВОЗВРАЩАТЬСЯ — можно удалить вместе с
  # привязками bind-uchaly-ident / bind-uchaly-pass / bind-uchaly-login.
  #
  # ЗАЧЕМ БЫЛ НУЖЕН РАНЬШЕ:
  #   Стандартный flow "default-provider-authorization-implicit-consent"
  #   содержит только стадию consent и НЕ содержит стадий ввода
  #   логина/пароля. Из-за этого:
  #
  #   1. Параметр prompt=login игнорировался — Authentik просто
  #      переиспользовал существующую сессию (cookie authentik_session).
  #   2. Возникал "SSO-эффект": пользователь не мог перелогиниться
  #      под другой учётной записью, потому что форма входа не
  #      показывалась.
  #
  #   Кастомный flow явно требовал identification → password → user_login
  #   при КАЖДОМ запросе к /authorize/.
  #
  # ПОЧЕМУ ОТКАЗАЛИСЬ:
  #   Такой подход ломает silent-возврат из user settings flow
  #   и password change flow: после редактирования ФИО пользователь
  #   должен снова вводить логин/пароль, что плохой UX.
  #
  #   Стандартный подход: сессия живёт, пока пользователь не нажмёт
  #   "Выйти". Именно fullLogout() убивает сессию Authentik, а
  #   следующий вход снова показывает форму логина.
  # ============================================================
  - model: authentik_flows.flow
    id: flow-uchaly-oauth-authorize
    identifiers:
      slug: uchaly-oauth-authorize
    attrs:
      name: "Uchaly OAuth2 Authorization"
      title: "Вход в Uchaly"
      designation: authorization
      authentication: none

  # --- Стадия 1: identification (ввод username/email) ---
  - model: authentik_flows.flowstagebinding
    id: bind-uchaly-ident
    identifiers:
      target: !KeyOf flow-uchaly-oauth-authorize
      stage: !Find [authentik_stages_identification.identificationstage, [name, "default-authentication-identification"]]
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  # --- Стадия 2: password (ввод пароля) ---
  - model: authentik_flows.flowstagebinding
    id: bind-uchaly-pass
    identifiers:
      target: !KeyOf flow-uchaly-oauth-authorize
      stage: !Find [authentik_stages_password.passwordstage, [name, "default-authentication-password"]]
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  # --- Стадия 3: user_login (устанавливает сессию) ---
  - model: authentik_flows.flowstagebinding
    id: bind-uchaly-login
    identifiers:
      target: !KeyOf flow-uchaly-oauth-authorize
      stage: !Find [authentik_stages_user_login.userloginstage, [name, "default-authentication-login"]]
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  # ============================================================
  # FLOW ИНВАЛИДАЦИИ (ИСПОЛЬЗУЕТСЯ ПРОВАЙДЕРОМ)
  #
  # Провайдер provider-uchaly указывает на ЭТОТ flow в поле
  # invalidation_flow.
  #
  # ЗАЧЕМ ЭТО НУЖНО:
  #   Дефолтный "default-provider-invalidation-flow" в
  #   Authentik 2026.8.3 после выполнения user_logout стадии
  #   показывает страницу-заглушку «You've logged out of Uchaly»
  #   с кнопками «Go back to overview» / «Log out of authentik» /
  #   «Log back into Uchaly». Он НЕ делает автоматический редирект
  #   на post_logout_redirect_uri, даже если тот передан вместе с
  #   id_token_hint.
  #
  #   Это видел пользователь: после выхода из SPA он попадал
  #   на /if/flow/default-provider-invalidation-flow/ с кнопками,
  #   а не обратно в SPA.
  #
  # НАШ FLOW:
  #   Содержит две стадии:
  #
  #     order 10: user_logout — убивает cookie authentik_session.
  #
  #     order 20: redirect (mode=static, target_static=URL SPA) —
  #       сразу делает 302 на фиксированный адрес SPA, минуя
  #       страницу завершения flow.
  #
  # ЧТО ЗНАЧИТ target_static = "http://localhost:62080/"
  #   Это КОРЕНЬ SPA. Мы не можем передать сюда конкретный путь
  #   (/profile, /admin), потому что target_static — статическая
  #   строка, а RedirectStage не умеет читать post_logout_redirect_uri
  #   из контекста flow в этой версии Authentik.
  #
  #   Но конкретный путь нам и не нужен: SPA перед вызовом
  #   fullLogout() сохраняет текущий путь в sessionStorage под
  #   ключом "post_logout_return_path". После возврата на корень
  #   AppLayout читает этот ключ и навигирует пользователя на
  #   исходную страницу через react-router.
  #
  # ПОЧЕМУ НЕ ИСПОЛЬЗУЕМ EXPRESSION POLICY + redirect_stage_target:
  #   Мы пробовали динамически подставлять post_logout_redirect_uri
  #   через Expression Policy. Не получилось по двум причинам:
  #
  #   1. Модель authentik_policies.policybinding не поддерживает
  #      привязку к stage — target должен быть Application / Flow /
  #      FlowStageBinding / User / Group. Blueprint падал с ошибкой
  #      "Invalid pk ... object does not exist".
  #
  #   2. RedirectStage в этой версии не читает plan.context
  #      "redirect_stage_target" — этот механизм появился в более
  #      поздних версиях Authentik.
  #
  #   Поэтому используем простой статический редирект на корень
  #   SPA. Восстановление конкретного пути делает сам SPA.
  #
  # ВАЖНО ПРО ПРОДАКШН:
  #   target_static — константа "http://localhost:62080/". Для
  #   продакшена замените на реальный домен SPA (например,
  #   "https://uchaly.example.com/"). Либо оставьте относительный
  #   путь, если SPA и Authentik находятся на одном домене.
  #
  #   Если у вас несколько окружений (dev/stage/prod) с разными
  #   URL, можно вынести этот URL в отдельный blueprint на каждое
  #   окружение или использовать переменные окружения Authentik
  #   (envsubst-подстановка в blueprint не поддерживается, поэтому
  #   придётся дублировать blueprint или генерировать его скриптом).
  # ============================================================
  - model: authentik_flows.flow
    id: flow-uchaly-invalidation
    identifiers:
      slug: uchaly-invalidation
    attrs:
      name: "Uchaly Invalidation"
      title: "Выход из Uchaly"
      designation: invalidation
      authentication: none

  # --- Стадия 1: logout ---
  #
  # Стадия "default-invalidation-logout" создаётся автоматически
  # при первом запуске Authentik. Она удаляет cookie
  # authentik_session и завершает сессию на сервере.
  - model: authentik_flows.flowstagebinding
    id: bind-uchaly-logout
    identifiers:
      target: !KeyOf flow-uchaly-invalidation
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, "default-invalidation-logout"]]
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  # --- Стадия 2: redirect ---
  #
  # mode=static + target_static="http://localhost:62080/".
  # После выполнения user_logout stage flow переходит к этой
  # стадии, которая делает 302 на указанный URL — корень SPA.
  #
  # ВАЖНО: target_static НЕ пустой. Если оставить пустым —
  # RedirectStage сделает редирект на дефолтную страницу
  # Authentik, и пользователь снова увидит форму логина.
  #
  # keep_context: false — не сохраняем контекст flow между
  # стадиями. Нам это не нужно, потому что между user_logout
  # и redirect ничего не передаётся.
  - model: authentik_stages_redirect.redirectstage
    id: stage-uchaly-invalidation-redirect
    identifiers:
      name: "Uchaly Invalidation Redirect"
    attrs:
      mode: static
      target_static: "http://localhost:62080/"
      keep_context: false

  - model: authentik_flows.flowstagebinding
    id: bind-uchaly-redirect
    identifiers:
      target: !KeyOf flow-uchaly-invalidation
      stage: !KeyOf stage-uchaly-invalidation-redirect
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  # ============================================================
  # FLOW РЕГИСТРАЦИИ (ENROLLMENT)
  #
  # ЗАЧЕМ ЭТО НУЖНО:
  #   В Authentik регистрация — это отдельный flow с designation
  #   "enrollment". Он не встроен в OAuth2-флоу, а запускается
  #   отдельно — по URL /if/flow/<slug>/.
  #
  # ВАЖНО ПРО ВЕРСИЮ:
  #   В 2024.12 в этой системе не было дефолтных стадий
  #   "default-enrollment-prompt" и "default-enrollment-login".
  #   Есть только "default-source-enrollment-*" — они предназначены
  #   для enrollment через source (LDAP/OAuth) и напрямую для
  #   самостоятельной регистрации НЕ подходят.
  #
  #   Поэтому все стадии enrollment-флоу создаются ЯВНО:
  #     1. Prompt-объекты (теперь 8 полей, включая скрытое type=internal
  #        и раздельные ФИО: Фамилия / Имя / Отчество)
  #     2. Prompt Stage (контейнер над полями)
  #     3. User Write Stage (создаёт пользователя и кладёт в группу User)
  #     4. User Login Stage (логинит после регистрации)
  #     5. Flow (designation: enrollment)
  #     6. FlowStageBinding × 3 (порядок: prompt → write → login)
  #
  # ВАЖНО ПРО IDENTIFIERS У PROMPT-ОБЪЕКТОВ:
  #   У модели authentik_stages_prompt.prompt уникальным полем
  #   является поле `name`, а НЕ `field_key`. Поэтому в identifiers
  #   указывается именно `name`. Если указать `field_key`, blueprint
  #   не найдёт существующий объект и попытается создать новый,
  #   что упадёт на unique-constraint (Prompt with this name already
  #   exists). Это делает применение blueprint не-идемпотентным:
  #   первый раз проходит, второй — падает.
  #
  #   `field_key` при этом остаётся важным — оно уходит в attrs
  #   и используется для маппинга значений на модель пользователя.
  #
  # ВАЖНО ПРО АТРИБУТЫ (family_name / given_name / middle_name):
  #   Модель authentik_core.user НЕ имеет отдельных колонок под имя
  #   и фамилию — есть только единое поле `name`. Дополнительные
  #   поля хранятся в JSONB-поле user.attributes.
  #
  #   UserWriteStage понимает префикс `attributes.` в field_key:
  #   если prompt имеет field_key = "attributes.family_name", то
  #   UserWriteStage запишет в user.attributes["family_name"] то,
  #   что ввёл пользователь. Именно этим механизмом мы и
  #   пользуемся для трёх отдельных полей ФИО.
  #
  #   Далее кастомный scope-mapping "Uchaly: Profile Claim" (см.
  #   выше) читает эти атрибуты и формирует OIDC-claims
  #   given_name / family_name / middle_name / name, которые
  #   SPA читает в fetchUserInfo().
  #
  # ВАЖНО ПРО type=internal:
  #   Enrollment-flow в Authentik (включая 2026.8.3) создаёт
  #   пользователей с типом "external" по умолчанию. Это не даёт
  #   им заходить в /if/user/ и /if/admin/ — интерфейс Authentik
  #   доступен только пользователям с типом "internal".
  #
  #   Чтобы обойти это, добавлено СКРЫТОЕ поле prompt с
  #   field_key: type и initial_value: internal. Prompt Stage
  #   передаёт его значение в UserWriteStage, который записывает
  #   его в поле type новой модели пользователя.
  #
  #   Пользователь не видит это поле в форме — оно hidden.
  #
  # ВАЖНО ПРО РЕДИРЕКТ ПОСЛЕ РЕГИСТРАЦИИ:
  #   В 2026.8.3 функция is_url_absolute (см. flows/views/executor.py)
  #   блокирует редирект на абсолютные URL через параметр `next`.
  #   Whitelist-механизма для внешних доменов в этой версии нет
  #   ни в Brand, ни в Tenant.
  #
  #   SPA решает эту проблему, передавая в next ОТНОСИТЕЛЬНЫЙ путь
  #   на /application/o/authorize/ — редирект на относительный URL
  #   разрешён. Далее authorize-эндпоинт выпускает code и редиректит
  #   на redirect_uri (уже в whitelist провайдера).
  #
  #   Сам enrollment-flow с этой логикой не работает — она целиком
  #   реализована в authService.registerWithAuthentik() в SPA.
  #
  # ПАРАМЕТР authentication:
  #   "none" — как и у flow авторизации, чтобы форма регистрации
  #   открывалась независимо от активной сессии.
  #
  # КАК ВЫЗЫВАЕТСЯ ИЗ SPA:
  #   authService.registerWithAuthentik() редиректит браузер на
  #   /if/flow/uchaly-enrollment/?next=<относительный OAuth2-authorize URL>.
  # ============================================================

  # --- Prompt-объекты: отдельные поля формы регистрации ---
  #
  # Каждое поле — это отдельная запись модели authentik_stages_prompt.prompt.
  # Поле field_key — это внутренний идентификатор поля, который потом
  # используется при маппинге значений на модель пользователя.
  # Для username/email/password/type Authentik мапит автоматически
  # по именам полей. Для всего, что начинается с `attributes.`,
  # значение попадает в JSONB-поле user.attributes.
  #
  # ПОЛЕ order: определяет порядок полей в UI-форме.
  #
  # ПОЛЕ type: тип поля формы. Доступные типы:
  #   - text      — обычная текстовая строка
  #   - username  — с валидацией username (буквы, цифры, @ . + - _)
  #   - email     — с валидацией email
  #   - password  — скрытое поле с индикатором сложности
  #   - number    — число
  #   - checkbox  — галочка
  #   - hidden    — скрытое поле (передаётся с формой, но не отображается)
  #   - static    — статический текст
  #   - redirect  — кнопка-редирект
  - model: authentik_stages_prompt.prompt
    id: prompt-enroll-username
    identifiers:
      name: "Uchaly Enrollment Username"
    attrs:
      field_key: username
      label: "Имя пользователя (логин)"
      type: username
      required: true
      placeholder: "Введите логин"
      order: 10

  # --- Фамилия ---
  # field_key с префиксом attributes. → значение попадёт в
  # user.attributes["family_name"], откуда его прочитает наш
  # кастомный scope-mapping "Uchaly: Profile Claim".
  - model: authentik_stages_prompt.prompt
    id: prompt-enroll-family-name
    identifiers:
      name: "Uchaly Enrollment Family Name"
    attrs:
      field_key: attributes.family_name
      label: "Фамилия"
      type: text
      required: true
      placeholder: "Иванов"
      order: 20

  # --- Имя ---
  # field_key = attributes.given_name → user.attributes["given_name"].
  - model: authentik_stages_prompt.prompt
    id: prompt-enroll-given-name
    identifiers:
      name: "Uchaly Enrollment Given Name"
    attrs:
      field_key: attributes.given_name
      label: "Имя"
      type: text
      required: true
      placeholder: "Иван"
      order: 30

  # --- Отчество ---
  # field_key = attributes.middle_name → user.attributes["middle_name"].
  # Не обязательно — у пользователей может не быть отчества
  # (например, для иностранных сотрудников).
  - model: authentik_stages_prompt.prompt
    id: prompt-enroll-middle-name
    identifiers:
      name: "Uchaly Enrollment Middle Name"
    attrs:
      field_key: attributes.middle_name
      label: "Отчество"
      type: text
      required: false
      placeholder: "Иванович"
      order: 40

  - model: authentik_stages_prompt.prompt
    id: prompt-enroll-email
    identifiers:
      name: "Uchaly Enrollment Email"
    attrs:
      field_key: email
      label: "Email"
      type: email
      required: true
      placeholder: "user@uchaly.com"
      order: 50

  - model: authentik_stages_prompt.prompt
    id: prompt-enroll-password
    identifiers:
      name: "Uchaly Enrollment Password"
    attrs:
      field_key: password
      label: "Пароль"
      type: password
      required: true
      placeholder: "Введите пароль"
      order: 60

  - model: authentik_stages_prompt.prompt
    id: prompt-enroll-password-repeat
    identifiers:
      name: "Uchaly Enrollment Password Repeat"
    attrs:
      field_key: password_repeat
      label: "Повторите пароль"
      type: password
      required: true
      placeholder: "Повторите пароль"
      order: 70

  # --- Скрытый prompt: принудительно ставит type=internal ---
  #
  # ЗАЧЕМ ЭТО НУЖНО:
  #   В Authentik (включая 2026.8.3) enrollment-flow создаёт
  #   пользователей с типом "external". Это не даёт им заходить
  #   в /if/user/ и /if/admin/.
  #
  #   Скрытое поле с field_key: type и initial_value: internal
  #   заставляет Prompt Stage передать в UserWriteStage значение
  #   "internal". UserWriteStage записывает его в атрибут type
  #   новой модели пользователя.
  #
  # ВАЖНО: тип hidden означает, что пользователь не видит это поле
  # в форме — оно передаётся невидимо.
  - model: authentik_stages_prompt.prompt
    id: prompt-enroll-type
    identifiers:
      name: "Uchaly Enrollment Type"
    attrs:
      field_key: type
      label: "User Type"
      type: hidden
      required: false
      initial_value: "internal"
      order: 80

  # --- Prompt Stage: контейнер, объединяющий все поля формы ---
  #
  # ВАЖНО: поля перечисляем через !KeyOf на созданные выше prompt-объекты.
  # Порядок в UI определяется полем order в каждом prompt.
  #
  # ПОЛЕ validation_policies: список policy-объектов, которые
  # дополнительно проверяют корректность введённых данных.
  # Мы оставляем пустым — встроенных валидаторов (required, type)
  # достаточно для базовой регистрации.
  - model: authentik_stages_prompt.promptstage
    id: stage-enroll-prompt
    identifiers:
      name: "Uchaly Enrollment Prompt"
    attrs:
      fields:
        - !KeyOf prompt-enroll-username
        - !KeyOf prompt-enroll-family-name
        - !KeyOf prompt-enroll-given-name
        - !KeyOf prompt-enroll-middle-name
        - !KeyOf prompt-enroll-email
        - !KeyOf prompt-enroll-password
        - !KeyOf prompt-enroll-password-repeat
        - !KeyOf prompt-enroll-type
      validation_policies: []

  # --- User Write Stage: создаёт пользователя и кладёт в группу User ---
  #
  # Это НАША собственная стадия (не default), потому что нам нужно
  # сразу поместить нового пользователя в группу "User". Иначе
  # он не увидит приложение Uchaly — policy bindings в конце
  # файла разрешают доступ только членам перечисленных групп.
  #
  # ПОЛЯ:
  #   user_creation_mode:
  #     "always_create"    — всегда создавать нового пользователя.
  #     Альтернативы: "never_create" (только обновление) или
  #     "create_when_required" (создавать только если пользователя
  #     нет; если есть — обновлять).
  #   create_users_as_inactive:
  #     "false" — сразу активные. Если поставить "true", то после
  #     регистрации пользователь будет неактивен, и админ должен
  #     его активировать вручную.
  #   create_users_group:
  #     Ссылка на группу, в которую добавляется новый пользователь.
  #
  # ВАЖНО ПРО АТРИБУТЫ:
  #   Поля attributes.family_name / attributes.given_name /
  #   attributes.middle_name, пришедшие из prompt-стадии, попадают
  #   в JSONB-поле user.attributes создаваемого пользователя.
  #   Оттуда их читает кастомный scope-mapping "Uchaly: Profile Claim"
  #   и превращает в OIDC-claims given_name / family_name /
  #   middle_name / name.
  #
  #   Поле type НЕ указывается в этой стадии напрямую. Оно приходит
  #   из prompt-поля prompt-enroll-type (hidden, initial_value=internal)
  #   и UserWriteStage автоматически применяет его к создаваемому
  #   пользователю.
  - model: authentik_stages_user_write.userwritestage
    id: stage-enroll-user-write
    identifiers:
      name: "Uchaly Enrollment User Write"
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: false
      create_users_group: !KeyOf group-user

  # --- User Login Stage: логинит пользователя после регистрации ---
  #
  # Устанавливает cookie authentik_session и редиректит пользователя
  # на URL из параметра `next` (или на дефолтную страницу, если
  # next не передан).
  #
  # ПОЛЕ session_duration:
  #   "seconds=0" — использовать дефолтную длительность сессии
  #   Authentik (обычно 12 часов).
  #
  # ВАЖНО: SPA передаёт относительный next, указывающий на
  # OAuth2-authorize URL. Это обходит проверку is_url_absolute,
  # и пользователь после регистрации автоматически попадает
  # в SPA уже аутентифицированным.
  - model: authentik_stages_user_login.userloginstage
    id: stage-enroll-login
    identifiers:
      name: "Uchaly Enrollment Login"
    attrs:
      session_duration: "seconds=0"

  # --- Flow: сам enrollment-флоу ---
  #
  # designation: enrollment — это ключевое поле, которое говорит
  # Authentik, что данный flow предназначен для регистрации.
  # Именно поэтому он доступен по URL /if/flow/<slug>/ без
  # предварительной аутентификации.
  - model: authentik_flows.flow
    id: flow-uchaly-enrollment
    identifiers:
      slug: uchaly-enrollment
    attrs:
      name: "Uchaly Registration"
      title: "Регистрация в Uchaly"
      designation: enrollment
      authentication: none

  # --- Привязки стадий к флоу (порядок важен) ---
  #
  # Порядок определяется полем order:
  #   order: 10 — Prompt Stage (сначала спрашиваем данные)
  #   order: 20 — User Write Stage (потом создаём пользователя)
  #   order: 30 — User Login Stage (потом логиним)
  #
  # ВАЖНО: редирект после регистрации делает не отдельная стадия,
  # а параметр next в URL enrollment-flow. SPA передаёт туда
  # относительный путь на OAuth2-authorize — это обходит проверку
  # is_url_absolute в 2026.8.3.
  - model: authentik_flows.flowstagebinding
    id: bind-uchaly-enroll-prompt
    identifiers:
      target: !KeyOf flow-uchaly-enrollment
      stage: !KeyOf stage-enroll-prompt
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  - model: authentik_flows.flowstagebinding
    id: bind-uchaly-enroll-write
    identifiers:
      target: !KeyOf flow-uchaly-enrollment
      stage: !KeyOf stage-enroll-user-write
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  - model: authentik_flows.flowstagebinding
    id: bind-uchaly-enroll-login
    identifiers:
      target: !KeyOf flow-uchaly-enrollment
      stage: !KeyOf stage-enroll-login
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  # ============================================================
  # USER SETTINGS FLOW — РЕДАКТИРОВАНИЕ ПРОФИЛЯ
  #
  # ЗАЧЕМ ЭТО НУЖНО:
  #   Пользователь должен иметь возможность менять свои ФИО
  #   (фамилия, имя, отчество) без участия администратора и
  #   без Gateway. Authentik предоставляет для этого нативный
  #   интерфейс через flow с designation="stage_configuration".
  #
  #   Такой flow доступен по URL /if/flow/<slug>/ и требует
  #   активной сессии Authentik (authentication: require_authenticated).
  #
  # КАК ЭТО РАБОТАЕТ:
  #   1. Пользователь открывает /if/flow/uchaly-user-settings/
  #      (или переходит туда по ссылке из SPA).
  #   2. Flow executor показывает Prompt Stage с текущими
  #      значениями атрибутов пользователя (attributes.family_name
  #      и т.д.) — они предзаполнены.
  #   3. Пользователь меняет значения, нажимает «Сохранить».
  #   4. User Write Stage записывает новые значения в
  #      user.attributes.family_name / given_name / middle_name.
  #   5. Flow завершается, пользователь возвращается в SPA
  #      (см. параметр next в URL flow).
  #
  # ВАЖНО ПРО EMAIL:
  #   Email НЕ включён в Prompt Stage — его нельзя менять
  #   из этого flow. Дополнительно на уровне атрибутов
  #   пользователя выставлен флаг
  #   goauthentik.io/user/can-change-email: false (см. ниже),
  #   который блокирует смену email и через стандартный
  #   интерфейс /if/user/.
  #
  # ВАЖНО ПРО ПРЕДЗАПОЛНЕНИЕ:
  #   Prompt Stage НЕ подставляет текущие значения автоматически —
  #   нужно явно указать выражение. Для этого используются два поля:
  #
  #     initial_value — выражение Python, которое выполняется при
  #       каждом рендере формы. Имеет доступ к объекту `user`
  #       (текущий аутентифицированный пользователь).
  #
  #     initial_value_expression: true — обязательный флаг.
  #       Без него Authentik воспримет initial_value как литерал
  #       и покажет пользователю текст выражения вместо реального
  #       значения.
  #
  # ВАЖНО ПРО designation:
  #   designation="stage_configuration" — это специальный тип flow,
  #   который используется как «настройки» из интерфейса /if/user/.
  #   Не путать с "enrollment" (регистрация) и "authorization"
  #   (вход через OAuth2).
  # ============================================================
  - model: authentik_flows.flow
    id: flow-uchaly-user-settings
    identifiers:
      slug: uchaly-user-settings
    attrs:
      name: "Uchaly User Settings"
      title: "Настройки профиля"
      designation: stage_configuration
      authentication: require_authenticated

  # --- Prompt-объекты для редактирования ФИО ---
  #
  # Каждое поле — отдельная запись модели authentik_stages_prompt.prompt.
  # field_key с префиксом "attributes." заставляет User Write Stage
  # записывать значение в JSONB-поле user.attributes.
  #
  # Атрибут "required: false" для отчества — у пользователя может
  # не быть отчества (иностранные сотрудники и т.п.).
  #
  # order определяет порядок полей в форме.
  - model: authentik_stages_prompt.prompt
    id: prompt-settings-family-name
    identifiers:
      name: "Uchaly Settings Family Name"
    attrs:
      field_key: attributes.family_name
      label: "Фамилия"
      type: text
      required: true
      placeholder: "Иванов"
      order: 10
      # Предзаполняем текущим значением из user.attributes.family_name.
      initial_value: |
        return user.attributes.get("family_name", "")
      initial_value_expression: true

  - model: authentik_stages_prompt.prompt
    id: prompt-settings-given-name
    identifiers:
      name: "Uchaly Settings Given Name"
    attrs:
      field_key: attributes.given_name
      label: "Имя"
      type: text
      required: true
      placeholder: "Иван"
      order: 20
      # Предзаполняем текущим значением из user.attributes.given_name.
      initial_value: |
        return user.attributes.get("given_name", "")
      initial_value_expression: true

  - model: authentik_stages_prompt.prompt
    id: prompt-settings-middle-name
    identifiers:
      name: "Uchaly Settings Middle Name"
    attrs:
      field_key: attributes.middle_name
      label: "Отчество"
      type: text
      required: false
      placeholder: "Иванович"
      order: 30
      # Предзаполняем текущим значением из user.attributes.middle_name.
      # Отчество опционально, поэтому пустая строка — валидное
      # значение по умолчанию.
      initial_value: |
        return user.attributes.get("middle_name", "")
      initial_value_expression: true

  # --- Prompt Stage: контейнер для полей ФИО ---
  #
  # Этот stage собирает все prompt-поля в одну форму.
  # Валидация ограничена встроенными правилами (required, type).
  # При необходимости сюда можно добавить validation_policies
  # с Expression Policy для дополнительных проверок.
  - model: authentik_stages_prompt.promptstage
    id: stage-settings-prompt
    identifiers:
      name: "Uchaly Settings Prompt"
    attrs:
      fields:
        - !KeyOf prompt-settings-family-name
        - !KeyOf prompt-settings-given-name
        - !KeyOf prompt-settings-middle-name
      validation_policies: []

  # --- User Write Stage: записывает изменения в профиль ---
  #
  # user_creation_mode: never_create — этот stage НЕ создаёт
  # новых пользователей. Он только обновляет существующего
  # (того, кто прошёл аутентификацию и открыл flow).
  #
  # create_users_as_inactive и create_users_group не указываются,
  # потому что они применимы только при создании нового
  # пользователя, а мы работаем в режиме never_create.
  #
  # ВАЖНО: User Write Stage автоматически подхватывает
  # значения из Prompt Stage и записывает их в соответствующие
  # поля модели User. Для field_key с префиксом "attributes."
  # значения идут в JSONB-поле user.attributes.
  - model: authentik_stages_user_write.userwritestage
    id: stage-settings-user-write
    identifiers:
      name: "Uchaly Settings User Write"
    attrs:
      user_creation_mode: never_create
      create_users_as_inactive: false

  # --- Привязки stages к flow (порядок важен) ---
  #
  # order: 10 — сначала Prompt Stage (показываем форму).
  # order: 20 — потом User Write Stage (сохраняем изменения).
  #
  # Больше stages в этом flow не нужно: аутентификация уже
  # пройдена (authentication: require_authenticated), а логин
  # повторять не надо — пользователь уже в сессии Authentik.
  - model: authentik_flows.flowstagebinding
    id: bind-settings-prompt
    identifiers:
      target: !KeyOf flow-uchaly-user-settings
      stage: !KeyOf stage-settings-prompt
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  - model: authentik_flows.flowstagebinding
    id: bind-settings-user-write
    identifiers:
      target: !KeyOf flow-uchaly-user-settings
      stage: !KeyOf stage-settings-user-write
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  # ============================================================
  # PASSWORD CHANGE FLOW — СМЕНА ПАРОЛЯ (ИСПОЛЬЗУЕМ ШТАТНЫЙ AUTHENTIK FLOW)
  #
  # ЗАЧЕМ ЭТО НУЖНО:
  #   Пользователь должен иметь возможность сменить пароль,
  #   зная текущий. Authentik предоставляет готовый
  #   default-password-change flow, который содержит все
  #   необходимые стадии: Identification (устанавливает pending_user),
  #   Password Stage (проверяет текущий пароль),
  #   Prompt Stage (запрашивает новый пароль) и
  #   User Write Stage (сохраняет новый пароль).
  #
  # ПОЧЕМУ НЕ ИСПОЛЬЗУЕМ СОБСТВЕННЫЙ FLOW:
  #   Мы создавали кастомный flow uchaly-password-change, но он
  #   не работал: в нём отсутствовала стадия Identification,
  #   которая устанавливает в контексте выполнения потока
  #   объект pending_user. Без этого User Write Stage не мог
  #   записать новый пароль, и flow падал с ошибкой
  #   "Запрос был отклонен. Unknown error".
  #
  #   Штатный flow default-password-change уже содержит
  #   Identification stage и корректно работает. Мы лишь
  #   переопределяем его отображаемые названия (name и title)
  #   на русские, чтобы пользователь видел привычный интерфейс.
  #
  # КАК ЭТО РАБОТАЕТ:
  #   1. Пользователь открывает /if/flow/default-password-change/
  #      (или переходит туда по ссылке из SPA).
  #   2. Flow executor показывает форму ввода текущего пароля
  #      (это делает Identification + Password stages).
  #   3. После успешной проверки текущего пароля появляется форма
  #      нового пароля (Prompt Stage).
  #   4. User Write Stage записывает новый пароль.
  #   5. Flow завершается, пользователь возвращается в SPA
  #      (см. параметр next в URL flow).
  #
  # ВАЖНО ПРО ПЕРЕОПРЕДЕЛЕНИЕ:
  #   Мы не создаём новый flow, а изменяем атрибуты существующего.
  #   Это безопасно: blueprint применяется поверх уже созданного
  #   Authentik объекта default-password-change и меняет только
  #   поля name и title. Все стадии и привязки остаются нетронутыми.
  # ============================================================
  - model: authentik_flows.flow
    identifiers:
      slug: default-password-change
    attrs:
      name: "Uchaly Password Change"
      title: "Смена пароля"
      designation: stage_configuration
      authentication: require_authenticated

  # ============================================================
  # ГЛОБАЛЬНЫЕ НАСТРОЙКИ BRAND
  #
  # ЗАЧЕМ ЭТО НУЖНО:
  #   Default user settings определяют поведение интерфейса
  #   /if/user/ для всех пользователей. Здесь мы явно фиксируем
  #   три настройки:
  #
  #   1. default_user_change_email: false
  #      Пользователь НЕ может менять свой email.
  #
  #   2. default_user_change_name: true
  #      Пользователь МОЖЕТ менять своё ФИО (через наш
  #      user settings flow).
  #
  #   3. default_user_change_username: false
  #      Пользователь НЕ может менять свой username.
  #
  # ВАЖНО ПРО ВЕРСИЮ:
  #   В Authentik 2024.2 и новее модель authentik_tenants.tenant
  #   была переименована в authentik_brands.brand. Все настройки
  #   default_user_change_* теперь находятся там.
  #
  # ВАЖНО ПРО БЕЗОПАСНОСТЬ:
  #   Этот блок переопределяет ТОЛЬКО три поля brand'а, потому что
  #   blueprint по умолчанию частично обновляет существующий объект
  #   (merge), а не создаёт новый. Если вы уже меняли брендинг в UI
  #   и не хотите рисковать — используйте ENV-переменные:
  #     AUTHENTIK_DEFAULT_USER_CHANGE_EMAIL=false
  #     AUTHENTIK_DEFAULT_USER_CHANGE_NAME=true
  #     AUTHENTIK_DEFAULT_USER_CHANGE_USERNAME=false
  # ============================================================
  - model: authentik_brands.brand
    identifiers:
      domain: "authentik-default"
    attrs:
      default_user_change_email: false
      default_user_change_name: true
      default_user_change_username: false

  # ============================================================
  # ТЕСТОВЫЕ ПОЛЬЗОВАТЕЛИ
  # ВНИМАНИЕ: это тестовые учётные записи для разработки.
  # Перед выводом в production — удалить или заменить на реальные.
  # Пароли соответствуют тем, что были в кастомном SeedData.cs:
  #   admin          / Admin123!
  #   manager        / Manager123!
  #   diagnost       / Diagnost123!
  #   ElectroService / Service123!
  #   MexService     / Service123!
  #
  # ВАЖНО ПРО АТРИБУТЫ ФИО:
  #   Тестовые пользователи тоже получают attributes.family_name /
  #   given_name / middle_name, чтобы кастомный scope-mapping
  #   "Uchaly: Profile Claim" корректно отдавал их в userinfo.
  #   Поле name (единое) тоже оставляем заполненным — оно
  #   используется в админке Authentik для отображения.
  #
  # ВАЖНО ПРО ЗАПРЕТ СМЕНЫ EMAIL:
  #   Каждому тестовому пользователю явно прописан атрибут
  #   goauthentik.io/user/can-change-email: false. Это дублирует
