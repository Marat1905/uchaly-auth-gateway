  # ============================================================
  # OAUTH2 / OIDC ПРОВАЙДЕР
  # ВАЖНО: поле называется redirect_uris (не allowed_redirect_uris).
  #
  # ГИБРИДНАЯ СХЕМА FLOW (ключевое решение):
  #
  #   authorization_flow:
  #     Используем ДЕФОЛТНЫЙ flow Authentik
  #     (default-provider-authorization-implicit-consent).
  #     Он уважает параметр prompt=none — если пользователь
  #     уже аутентифицирован, форма логина не показывается,
  #     сразу выпускается authorization code.
  #
  #     Это критично для silent-возврата из user settings flow
  #     и password change flow: после редактирования ФИО
  #     пользователь не должен вводить пароль заново.
  #
  #   invalidation_flow:
  #     Используем НАШ кастомный flow (flow-uchaly-invalidation),
  #     а НЕ дефолтный default-provider-invalidation-flow.
  #
  #     Причина: дефолтный flow после выполнения user_logout
  #     стадии показывает страницу-заглушку
  #     «You've logged out of Uchaly» с кнопками
  #     «Go back to overview» / «Log out of authentik» /
  #     «Log back into Uchaly». Он НЕ делает автоматический
  #     редирект на post_logout_redirect_uri, даже если тот
  #     передан вместе с id_token_hint.
  #
  #     Наш кастомный flow (flow-uchaly-invalidation) содержит
  #     user_logout + redirect (со статическим target_static =
  #     корень SPA). После user_logout стадии flow сразу
  #     делает 302 на SPA, минуя страницу-заглушку.
  #
  #     Именно так решается задача «выйти → вернуться на ту же
  #     страницу SPA, где был» без выброса на форму логина
  #     самого Authentik или на страницу-заглушку.
  #
  # ВАЖНО ПРО grant_types (2026.8.3+):
  #   Начиная с 2026.8 у OAuth2Provider появилось обязательное поле
  #   grant_types. Если оно пустое — провайдер отвергает все
  #   authorize-запросы с ошибкой "Invalid grant_type for provider",
  #   а SPA получает "invalid_request: The request is otherwise malformed".
  #
  #   Нужно явно указать:
  #     authorization_code — стандартный Authorization Code Flow (PKCE),
  #                          используется нашим SPA.
  #     refresh_token      — обновление access-токена через refresh-токен.
  #
  # ВАЖНО ПРО property_mappings:
  #   Здесь мы используем НЕ стандартный маппинг
  #   "authentik default OAuth Mapping: OpenID 'profile'", а наш
  #   собственный "Uchaly: Profile Claim" (см. выше). Причина:
  #   стандартный маппинг извлекает given_name/family_name из
  #   единого поля user.name (разбиением по пробелам). У нас же
  #   ФИО хранится в user.attributes (family_name, given_name,
  #   middle_name) — отдельными записями. Кастомный маппинг
  #   читает их напрямую и складывает в привычные OIDC-claims.
  #
  # ПРО РЕГИСТРАЦИЮ:
  #   Поле enrollment_flow указывает на enrollment-флоу, который
  #   используется для регистрации. Authentik показывает ссылку
  #   "Sign up" на странице входа, ведущую в этот флоу. Наш SPA
  #   использует её же через authService.registerWithAuthentik().
  # ============================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-uchaly
    identifiers:
      name: Uchaly OAuth2 Provider
    attrs:
      client_type: public
      client_id: uchaly-frontend

      # ========================================================
      # Разрешённые grant types для OAuth2.
      #
      # В 2026.8.3 поле обязательно: без него провайдер отвергает
      # authorize-запросы с ошибкой "Invalid grant_type for provider".
      # ========================================================
      grant_types:
        - authorization_code
        - refresh_token

      redirect_uris:
        - matching_mode: strict
          url: "http://localhost:62080/auth/callback"
        - matching_mode: strict
          url: "http://localhost:3000/auth/callback"
        - matching_mode: strict
          url: "http://10.0.9.100:62080/auth/callback"
        - matching_mode: strict
          url: "http://localhost:30008/auth/callback"
        - matching_mode: strict
          url: "http://localhost/auth/callback"
        - matching_mode: strict
          url: "http://localhost:8080/auth/callback"

      # ========================================================
      # Logout URIs — куда возвращать пользователя ПОСЛЕ end-session.
      # Должны совпадать с post_logout_redirect_uri в authService.fullLogout().
      #
      # ВАЖНО: сюда НЕЛЬЗЯ добавить произвольный путь (например
      # /profile) — whitelist матчит по точному совпадению.
      # Поэтому SPA передаёт корень origin, а конкретный путь
      # восстанавливает сама через sessionStorage (см. AppLayout
      # и authService.fullLogout в SPA).
      #
      # Однако в нашем случае эти URI практически не используются:
      # кастомный invalidation-flow делает редирект на корень SPA
      # через target_static, не обращаясь к этому whitelist'у.
      # Оставляем их на случай перехода на дефолтный flow.
      # ========================================================
      logout_uris:
        - "http://localhost:30008/"
        - "http://localhost:62080/"
        - "http://localhost:3000/"
        - "http://localhost:8080/"
        - "http://localhost/"
        - "http://10.0.9.100:62080/"

      # ⬇⬇⬇ ДЕФОЛТНЫЙ FLOW АВТОРИЗАЦИИ AUTHENTIK ⬇⬇⬇
      #
      # Стандартный flow Authentik. Уважает prompt=none — если
      # пользователь уже аутентифицирован, форма логина не
      # показывается, сразу выпускается authorization code.
      #
      # Это нужно для silent-возврата из user settings flow
      # и password change flow (без повторного ввода пароля).
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]

      # ⬇⬇⬇ НАШ FLOW ИНВАЛИДАЦИИ ⬇⬇⬇
      #
      # ВАЖНО: НЕ используем дефолтный
      # default-provider-invalidation-flow, потому что он
      # показывает страницу-заглушку «You've logged out of Uchaly»
      # после выполнения user_logout.
      #
      # Наш кастомный flow (flow-uchaly-invalidation) содержит
      # user_logout + redirect (статический target_static = корень
      # SPA). При заходе на end-session Authentik сразу убивает
      # сессию и делает 302 на корень SPA, минуя страницу-заглушку.
      invalidation_flow: !KeyOf flow-uchaly-invalidation

      # ⬇⬇⬇ НАШ FLOW РЕГИСТРАЦИИ ⬇⬇⬇
      # Ссылка "Sign up" на странице логина ведёт в этот флоу.
      # SPA использует её же через authService.registerWithAuthentik().
      enrollment_flow: !KeyOf flow-uchaly-enrollment

      # ========================================================
      # Property mappings: каким образом заполняются claims токена.
      #
      # Для стандартных scope используем дефолтные маппинги Authentik:
      #   - openid  → claim sub
      #   - email   → claim email
      #
      # Для profile используем НАШ маппинг scope-profile-uchaly
      # (см. выше) — он читает ФИО из user.attributes.
      #
      # Дополнительно добавляем scope-groups — наш кастомный
      # маппинг, который кладёт в токен список групп.
      # ========================================================
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !KeyOf scope-profile-uchaly
        - !KeyOf scope-groups
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      access_token_validity: "hours=1"
      refresh_token_validity: "days=1"
      sub_mode: "user_email"

  # ============================================================
  # ПРИЛОЖЕНИЕ
  # ============================================================
  - model: authentik_core.application
    id: app-uchaly
    identifiers:
      slug: uchaly
    attrs:
      name: "Uchaly"
      provider: !KeyOf provider-uchaly
      meta_description: "Uchaly Corporate Platform"
      meta_publisher: "Uchaly"
      open_in_new_tab: false

